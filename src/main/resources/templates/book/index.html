<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common :: meta_header('書籍一覧',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/index.css}" />
    <script type="text/javascript" th:src="@{/js/book/index.js}"></script>
</head>
<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍一覧</div>
               
               
                <head>
                    <style>
                        .index_button {
                            background-color: #3fb5d0; /* 水色 */
                            color: white; /* 文字色 */
                            padding: 12px 24px;
                            border: none;
                            border-radius: 8px; /* 角を丸く */
                            font-size: 16px;
                            cursor: pointer;
                            transition: background-color 0.3s ease, transform 0.2s ease;
                            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                        }
               
                        .index_button:hover {
                            background-color: #45a049;
                            transform: scale(1.05); /* 少し大きくなる */
                        }
               
                        .button {
                            text-align: right; /* 右揃え */
                            margin-top: 40px;
                        }
                    </style>
                </head>
                <body>
                    <div class="button">
                        <button type="button" class="index_button" onclick="location.href='http://localhost:8080/mt_library/book/add'">+書籍登録</button>
                    </div>
                </body>
               
                <table class="books_table">
                        <tr>
                            <th>書籍名</th>
                            <th>ISBN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="bookMst : ${bookMstList}">
                           
                           
                            <td>
                               
                               
                               
                                <a th:href="@{/book/edit/{id}(id=${bookMst.id})}" style="margin-right: 10px;">✍</a>
                               
                                <head>
                                    <!-- Font AwesomeのCSSをCDNで読み込み -->
                                    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
                                </head>
                               
                                 <!-- 削除機能 -->
                                <form th:action="@{'/books/delete/' + ${bookMst.id}}" method="post" style="display:inline;">
                                
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                
                                <button type="submit" onclick="return confirm('本当に削除しますか？')" style="border:none; background:none; cursor:pointer;">
                                <!-- ごみ箱アイコン -->
                                <i class="fas fa-trash" style="font-size: 15px; color: rgb(120, 117, 117);"></i>
                                </button>
                                </form>
                             
                                <span th:text="${bookMst.title}">書籍タイトル</span>
                            </td>
                            <td th:text="${bookMst.isbn}">ISBNコード</td>
                           
                        </tr>
                    </tbody>
                </table>
           
            <div th:if="${successMessage}" class="success-message">
    
            </div>
           
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>

<!-- 削除成功メッセージポップアップ -->
<div id="popup-message"
     th:if="${successMessage}"
     th:text="${successMessage}"
     style="display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #d4edda;
            color: #155724;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-size: 18px;
            z-index: 9999;">
</div>

<!-- 削除済みエラーメッセージポップアップ -->
<div id="popup-error"
     th:if="${errorMessage}"
     th:text="${errorMessage}"
     style="display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #f8d7da;
            color: #721c24;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-size: 18px;
            z-index: 9999;">
</div>

<!-- 共通スクリプト -->
<script>
  window.addEventListener('DOMContentLoaded', function () {
    ['popup-message', 'popup-error'].forEach(function(id) {
      const popup = document.getElementById(id);
      if (popup) {
        popup.style.display = 'block';
        setTimeout(() => {
          popup.style.transition = "opacity 0.5s";
          popup.style.opacity = 0;
          setTimeout(() => popup.remove(), 500);
        }, 3000);
      }
    });
  });
</script>

</body>
